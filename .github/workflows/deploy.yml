name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Roll out
        run: docker compose up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f
