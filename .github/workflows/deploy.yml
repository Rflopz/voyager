name: Deploy

# SECURITY: this repo is PUBLIC and this job runs on a SELF-HOSTED runner
# (physical access to the Acer machine's docker socket). NEVER add a
# `pull_request` or `pull_request_target` trigger here — a fork could open
# a PR and have its workflow code execute directly on that machine
# ("pwn request" attack). Only trusted, direct triggers (push to main by a
# repo collaborator, or manual workflow_dispatch) are safe on this runner.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Roll out
        run: docker compose up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f
